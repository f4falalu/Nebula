<title>Nebula Requisitions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: left rail navigation + working pane; requisition pages use a document/ledger split. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --line: #d9ded6;
  --line-strong: #b9c1b5;
  --fg: #18211d;
  --fg-2: #4b5751;
  --fg-3: #6f7b74;
  --accent: #0c6b58;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --good: #1f7a4d;
  --good-soft: #def2e6;
  --warn: #9a5b00;
  --warn-soft: #fbecd2;
  --bad: #b3261e;
  --bad-soft: #fbe2df;
  --info: #2f5da8;
  --info-soft: #e1e9f7;
  --muted-soft: #e8ebe6;
  --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 4px 16px rgba(20, 30, 25, 0.06);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #171d1a; --surface-2: #1d2420; --line: #2b3430; --line-strong: #3c4842;
    --fg: #e7ece8; --fg-2: #b3beb8; --fg-3: #8a968f; --accent: #4fc2a5; --accent-ink: #08201a; --accent-soft: #163a31;
    --good: #5cc98f; --good-soft: #163625; --warn: #e6a640; --warn-soft: #3a2a10; --bad: #f2867c; --bad-soft: #3d1a17;
    --info: #86a9e8; --info-soft: #1a2740; --muted-soft: #232b27; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #171d1a; --surface-2: #1d2420; --line: #2b3430; --line-strong: #3c4842;
  --fg: #e7ece8; --fg-2: #b3beb8; --fg-3: #8a968f; --accent: #4fc2a5; --accent-ink: #08201a; --accent-soft: #163a31;
  --good: #5cc98f; --good-soft: #163625; --warn: #e6a640; --warn-soft: #3a2a10; --bad: #f2867c; --bad-soft: #3d1a17;
  --info: #86a9e8; --info-soft: #1a2740; --muted-soft: #232b27; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: 0.005em; }
h1 { font-size: 1.6rem; line-height: 1.2; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--fg-3); }
.small { font-size: 0.86rem; }
.boot { padding: 48px 24px; color: var(--fg-3); font-family: var(--font-head); }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); font-weight: 600; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 500; font-size: 13px; }
.brand b { font-family: var(--font-head); font-size: 1.1rem; display: block; line-height: 1.1; }
.brand span { font-size: 0.72rem; color: var(--fg-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: var(--r); color: var(--fg-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { font-family: var(--font-mono); font-size: 0.75rem; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 7px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; color: var(--fg-3); padding: 0 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar .search { flex: 1; max-width: 560px; position: relative; }
.topbar .search input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); }
.topbar .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.search-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: 60vh; overflow: auto; z-index: 20; }
.search-results a { display: block; padding: 8px 12px; text-decoration: none; color: var(--fg); border-bottom: 1px solid var(--line); }
.search-results a:hover, .search-results a:focus { background: var(--surface-2); }
.page { padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1360px; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .sub { color: var(--fg-3); margin-top: 4px; }
.menu-btn { display: none; }
.banner { padding: 8px 12px; border-radius: var(--r); background: var(--info-soft); color: var(--info); font-size: 0.88rem; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: 260px; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .rail.open { transform: none; }
  .menu-btn { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

/* ---------- primitives ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; padding: 7px 12px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 3px 8px; font-size: 0.85rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.card.flush { padding: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-body { padding: 16px; }
.section-title { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 0.8rem; color: var(--fg-2); font-weight: 500; }
.field .hint { font-size: 0.78rem; color: var(--fg-3); }
.input, .field input, .field select, .field textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); min-width: 0; }
.field textarea { min-height: 72px; resize: vertical; }
.input.sm { padding: 3px 6px; font-size: 0.88rem; }
.check { display: inline-flex; gap: 6px; align-items: center; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 500; white-space: nowrap; background: var(--muted-soft); color: var(--fg-2); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.8; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.plain::before { display: none; }

.table-wrap { overflow-x: auto; min-width: 0; }
table.t { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.t th { text-align: left; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.clickable { cursor: pointer; }
table.t tr.clickable:hover td { background: var(--surface-2); }
table.t th.num, table.t td.num { text-align: right; }
table.t tr.dim td { opacity: 0.55; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .label { font-size: 0.78rem; color: var(--fg-3); }
.stat .value { font-family: var(--font-head); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .foot { font-size: 0.78rem; color: var(--fg-3); }
.stat.headline { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }

.empty { padding: 32px 16px; text-align: center; color: var(--fg-3); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h3 { color: var(--fg); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 13, 0.45); z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; min-width: 0; }
.modal.wide { width: min(980px, 100%); }
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.modal-body { padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.error-box { background: var(--bad-soft); color: var(--bad); border-radius: var(--r); padding: 10px 12px; white-space: pre-line; font-size: 0.9rem; }
.note-box { background: var(--surface-2); border-radius: var(--r); padding: 10px 12px; font-size: 0.88rem; color: var(--fg-2); }

.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r); box-shadow: var(--shadow); max-width: 380px; white-space: pre-line; }
.toast.bad { background: var(--bad); color: #fff; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 12px; color: var(--fg-3); font-weight: 500; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

/* lifecycle rail — the requisition's eight stages */
.stage-rail { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0; overflow-x: auto; }
.stage { position: relative; padding: 10px 8px 0; min-width: 92px; display: flex; flex-direction: column; gap: 4px; }
.stage::before { content: ""; position: absolute; top: 17px; left: 0; right: 0; height: 2px; background: var(--line); }
.stage:first-child::before { left: 50%; }
.stage:last-child::before { right: 50%; }
.stage.completed::before { background: var(--accent); }
.stage .dot { position: relative; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); margin: 0 auto; }
.stage.completed .dot { background: var(--accent); border-color: var(--accent); }
.stage.not_applicable .dot { border-style: dashed; }
.stage.current .dot { box-shadow: 0 0 0 4px var(--accent-soft); }
.stage .name { text-align: center; font-size: 0.8rem; font-weight: 600; font-family: var(--font-head); }
.stage .when { text-align: center; font-size: 0.72rem; color: var(--fg-3); font-family: var(--font-mono); }

/* review split */
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
.doc-pane { position: sticky; top: 64px; display: flex; flex-direction: column; gap: 8px; }
.doc-view { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: calc(100vh - 140px); min-height: 280px; display: grid; place-items: start center; }
.doc-view img { max-width: 100%; display: block; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } .doc-pane { position: static; } }

.line-row td { background: var(--surface); }
.cand { display: flex; flex-direction: column; gap: 4px; }
.cand button { text-align: left; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 0.9rem; }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--fg-3); font-size: 11px; font-family: var(--font); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-strong); }
.bar-track { height: 10px; border-radius: 3px; background: var(--muted-soft); overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); }
.funnel { display: flex; flex-direction: column; gap: 10px; }
.funnel-row { display: grid; grid-template-columns: 90px minmax(0, 1fr) 110px; gap: 10px; align-items: center; }
.coverage { font-size: 0.76rem; color: var(--fg-3); }

.timeline-event { border-left: 2px solid var(--line); padding: 2px 0 10px 12px; }
.timeline-event.superseded { opacity: 0.55; }
.timeline-event.superseded .what { text-decoration: line-through; }
details > summary { cursor: pointer; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.filters .field { min-width: 150px; }

/* Administration, approvals and audit log */
.admin-stat-btn { text-align: left; cursor: pointer; font: inherit; color: inherit; }
.admin-stat-btn:hover { border-color: var(--accent); }
.admin-filter { max-width: 320px; flex: 1; min-width: 0; }
.admin-csv { min-height: 140px; font-size: 0.85rem; }
.admin-preview { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); }
.admin-x { padding: 0 4px; margin-left: 2px; line-height: 1; }
.admin-big { font-family: var(--font-head); font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.admin-fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.admin-fieldset legend { padding: 0 4px; color: var(--fg-2); font-weight: 500; }

.appr-card { border-left: 3px solid var(--warn); }
.appr-changes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.appr-changes li { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 4px 12px; padding: 6px 10px; background: var(--surface-2); border-radius: var(--r); }
.appr-field { font-weight: 500; font-size: 0.88rem; }
@media (max-width: 560px) { .appr-changes li { grid-template-columns: minmax(0, 1fr); } }

.audit-json { margin: 0; padding: 8px 10px; background: var(--surface-2); border-radius: var(--r); font-family: var(--font-mono); font-size: 0.78rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
.audit-id { font-size: 0.72rem; overflow-wrap: anywhere; max-width: 180px; }

/* Analytics & history pages. Series slots 1–3 from the validated reference palette, stepped per theme. */
:root { --viz-s1: #2a78d6; --viz-s2: #eb6834; --viz-s3: #1baf7a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --viz-s1: #3987e5; --viz-s2: #d95926; --viz-s3: #199e70; } }
:root[data-theme="dark"] { --viz-s1: #3987e5; --viz-s2: #d95926; --viz-s3: #199e70; }

.filter-bar { display: flex; flex-direction: column; gap: 6px; }
.filter-summary b { color: var(--fg-2); font-weight: 600; }
.viz { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.viz-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--fg-2); }
.viz-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }
.viz-plot { position: relative; }
.viz-cross { stroke: var(--line-strong); stroke-width: 1; }
.viz-tip { position: absolute; top: 4px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px 10px; font-size: 0.8rem; pointer-events: none; display: flex; flex-direction: column; gap: 2px; min-width: 170px; z-index: 2; }
.viz-tip .num { float: right; margin-left: 12px; font-weight: 600; }
.viz-track { height: 12px; }
.viz-fill { border-radius: 0 4px 4px 0; }
.barlist, .stage-bars { display: flex; flex-direction: column; gap: 8px; }
.barlist-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) minmax(90px, max-content); gap: 10px; align-items: center; }
.barlist-label { overflow-wrap: anywhere; }
.viz-excl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.84rem; }
.viz-excl li { display: flex; justify-content: space-between; gap: 10px; color: var(--fg-2); }
.ofr-card { display: flex; flex-direction: column; gap: 8px; }
.ofr-card .big { font-family: var(--font-head); font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.ofr-card.headline { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.attn { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.attn li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.attn li:last-child { border-bottom: 0; }
.count-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.count-cell { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: var(--r); background: var(--surface-2); font-size: 0.86rem; }
.count-cell b { font-variant-numeric: tabular-nums; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--fg); }
@media (max-width: 560px) {
  .barlist-row { grid-template-columns: minmax(0, 1fr) minmax(80px, max-content); }
  .barlist-row .viz-track { grid-column: 1 / -1; grid-row: 2; }
  .funnel-row { grid-template-columns: 76px minmax(0, 1fr); }
  .funnel-row > .num { grid-column: 1 / -1; }
}

/* V2 sign-in and account pages */
.auth-shell { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); }
.auth-card { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); min-width: 0; }
.auth-card .cl-rootBox, .auth-card .cl-card { max-width: 100%; }
